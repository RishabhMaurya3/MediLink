<!--
  This is the updated SVG code for the 'MediLink' logo.
  It now includes the text 'Dashboard Panel' in a smaller, bold, black font just below
  the main project name. The colors and overall layout are preserved to maintain
  a consistent brand identity. The vector format ensures the logo remains
  crisp at any size.
-->
<svg width="250" height="80" viewBox="0 0 250 80" xmlns="http://www.w3.org/2000/svg">

  <!-- A group to hold the logo elements for easy positioning -->
  <g transform="translate(10, 10)">

    <!--
      Medical cross symbol using two rectangles.
      The horizontal rectangle is positioned slightly below the vertical one for a classic look.
    -->
    <rect x="0" y="20" width="60" height="20" fill="#007bff" rx="5" ry="5" />
    <rect x="20" y="0" width="20" height="60" fill="#007bff" rx="5" ry="5" />

    <!--
      The "MediLink" text.
      The first part "Medi" is a darker blue, and "Link" is a slightly lighter blue
      to match the color scheme and emphasize the name.
    -->
    <text x="80" y="40" font-family="Arial, sans-serif" font-size="35" font-weight="bold" fill="#343a40">
      <tspan fill="#0056b3">MediLink</tspan>
      
    </text>

    <!--
      The new "Dashboard Panel" text added below the main name.
      The font is bold, black, and its position is adjusted to align
      with the slightly shifted main name.
    -->
    <text x="80" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#343a40">
      Dashboard Panel
    </text>

  </g>
</svg>
